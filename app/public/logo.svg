<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="30" fill="#111111"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Torso -->
  <path d="M100 38 C82 38 68 52 68 70 L68 115 L82 120 L82 110 L118 110 L118 120 L132 115 L132 70 C132 52 118 38 100 38Z" fill="url(#bg)" filter="url(#glow)"/>
  <!-- Head -->
  <circle cx="100" cy="26" r="16" fill="url(#bg)" filter="url(#glow)"/>
  <!-- Left bicep -->
  <path d="M68 65 C54 60 42 66 39 80 C36 90 44 100 54 96 L68 86Z" fill="url(#bg)" filter="url(#glow)"/>
  <!-- Left forearm/fist -->
  <path d="M39 80 C30 85 26 98 33 107 C37 112 45 110 47 103 L54 96Z" fill="url(#bg)" filter="url(#glow)"/>
  <!-- Right bicep -->
  <path d="M132 65 C146 60 158 66 161 80 C164 90 156 100 146 96 L132 86Z" fill="url(#bg)" filter="url(#glow)"/>
  <!-- Right forearm/fist -->
  <path d="M161 80 C170 85 174 98 167 107 C163 112 155 110 153 103 L146 96Z" fill="url(#bg)" filter="url(#glow)"/>
  <!-- Muscle lines -->
  <path d="M90 62 Q100 75 110 62" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M86 85 Q100 95 114 85" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" fill="none"/>
  <!-- Text "Bodyform" -->
  <text x="100" y="160" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="url(#text)">Bodyform</text>
</svg>
